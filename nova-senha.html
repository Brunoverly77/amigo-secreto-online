<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novo PIN — Amigo Secreto de Natal</title>
<meta name="theme-color" content="#071324">
<meta name="robots" content="noindex">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127876;</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/natal.css">
</head>
<body>

<div class="ceu" aria-hidden="true"></div>

<main class="pagina">

  <header class="marca">
    <span class="arvore" aria-hidden="true">&#127876;</span>
    <h1>Amigo Secreto de Natal</h1>
  </header>

  <div data-conteudo>

    <div id="tela-carregando" class="tela-carregando">
      <span class="arvore">&#127876;</span>
      Conferindo o link...
    </div>

    <section class="cartao escondido" id="painel-novo">
      <h2>&#128273; Criar um PIN novo</h2>
      <p class="ajuda">Escolha um PIN de 6 números pra sua conta.</p>

      <form id="form-novo" novalidate>
        <div class="campo-grupo">
          <label for="novo-pin">Novo PIN</label>
          <input class="campo campo-pin" type="password" id="novo-pin"
                 inputmode="numeric" autocomplete="new-password"
                 maxlength="6" placeholder="••••••" required>
        </div>
        <button class="btn btn-ouro" type="submit" id="btn-salvar-pin">
          Salvar e entrar
        </button>
      </form>
    </section>

    <section class="cartao escuro escondido" id="painel-invalido">
      <h2>&#128533; Link expirado</h2>
      <p class="ajuda">
        Esse link de recuperação não vale mais (eles duram pouco tempo).
        Peça um novo na tela de entrar.
      </p>
      <a class="btn btn-ouro" href="login.html" style="text-decoration:none">
        Voltar para o login
      </a>
    </section>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/comum.js"></script>
<script src="js/auth.js"></script>
<script src="js/nova-senha.js"></script>
</body>
</html>
